model:
  name: gpt2       # GPT-2 (124M); full weights, no LoRA — reward head is one linear layer
  dropout: 0.1

training:
  epochs: 3        # RM overfits after 1–3 epochs; watch val accuracy, not just loss
  batch_size: 8
  lr: 1.0e-5       # conservative; reward head is randomly initialised, transformer is not
  warmup_steps: 100
  weight_decay: 0.01
  max_grad_norm: 1.0
  log_interval: 50

data:
  max_length: 512
  val_fraction: 0.05

model:
  name: gpt2
  use_lora: true   # LoRA keeps trainable params at ~0.7M vs 124M full fine-tune
  lora_r: 8
  lora_alpha: 32
  lora_dropout: 0.1

training:
  epochs: 2
  batch_size: 8
  lr: 2.0e-5
  warmup_steps: 200
  weight_decay: 0.01
  max_grad_norm: 1.0
  log_interval: 50

data:
  max_length: 512
